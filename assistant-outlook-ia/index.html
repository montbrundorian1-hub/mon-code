<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Politique de sécurité du contenu (CSP). Hébergement statique : déclarée en balise meta.
      - Scripts : application + Office.js (CDN Microsoft, obligatoire pour un complément Outlook).
      - 'wasm-unsafe-eval' : nécessaire à ONNX Runtime Web (inférence WebAssembly locale).
      - Connexions sortantes : application, Office.js, et téléchargement des poids de modèles
        (Hugging Face) uniquement. Doublé par le garde réseau applicatif (src/security/networkGuard.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com 'wasm-unsafe-eval'; connect-src 'self' https://appsforoffice.microsoft.com https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob:; frame-src 'self' https://appsforoffice.microsoft.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Assistant Outlook IA</title>
    <link rel="icon" type="image/png" href="./assets/icon-32.png" />
    <!-- Office.js : CDN officiel. Si indisponible, l'application passe en mode démonstration. -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="boot">Chargement de l’assistant…</p>
    </div>
    <noscript>JavaScript est nécessaire pour utiliser l’Assistant Outlook IA.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
